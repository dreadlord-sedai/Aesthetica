<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Aesthetica Shop</title>
    <link href="assets/icons/favicon.ico" type="image/x-ico" rel="icon" />
    <link href="assets/css/nav.css" rel="stylesheet" />
    <link href="assets/css/sidebar.css" rel="stylesheet" />
    <link href="assets/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="assets/css/nouislider.min.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link href="assets/css/shop.css" rel="stylesheet" />
    <link href="assets/css/dark-theme.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Mobile Header -->
    <div class="mobile-header">
      <button class="sidebar-toggle" type="button" aria-label="Toggle navigation">
        <i class="bi bi-list fs-3"></i>
      </button>
      <a class="navbar-brand brand-logo" href="index.html"></a>
      <div
        class="kart-icon position-relative"
        onclick="window.location.href='cart.html'"
        style="cursor: pointer"
      >
        <i class="fa-solid fa-cart-shopping"></i>
        <span
          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
          id="shop-icon-badge-mobile"
        ></span>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <button class="sidebar-close" type="button" aria-label="Close">&times;</button>

      <div class="sidebar-brand">
        <a class="brand-logo" href="index.html"></a>
        <span class="sidebar-tagline">Curated visuals</span>
      </div>

      <nav class="sidebar-nav">
        <a class="sidebar-link active" href="shop.html"><i class="bi bi-shop"></i>Shop</a>
        <a class="sidebar-link" href="cart.html"><i class="fa-solid fa-cart-shopping"></i>Cart</a>
        <a class="sidebar-link" href="all_categories.html"><i class="bi bi-grid"></i>All Categories</a>
      </nav>

      <hr class="sidebar-divider" />

      <div class="sidebar-utilities">
        <div class="sidebar-cart" onclick="window.location.href='cart.html'" style="cursor: pointer">
          <div class="kart-icon position-relative">
            <i class="fa-solid fa-cart-shopping"></i>
            <span
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
              id="shop-icon-badge"
            ></span>
          </div>
          <span class="sidebar-cart-label">Cart</span>
          <span class="price" id="nav-cart-price">00.00</span>
        </div>

        <div id="auth-menu" class="sidebar-auth-stack d-none">
          <a class="sidebar-link" href="my_account.html"><i class="bi bi-person"></i>Profile</a>
          <a class="sidebar-link" onclick="signOut()"><i class="bi bi-box-arrow-right"></i>Log Out</a>
        </div>

        <div id="guest-auth-menu" class="sidebar-guest-auth d-none">
          <a href="sign_in.html" class="btn btn-outline-primary btn-sm">Sign In</a>
          <a href="sign_up.html" class="btn btn-primary btn-sm">Sign Up</a>
        </div>
      </div>

      <div class="sidebar-footer">
        <small>&copy; 2026 Aesthetica</small>
      </div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Filter Drawer Offcanvas -->
    <div class="filter-drawer-overlay" id="filterDrawerOverlay"></div>
    <div class="filter-drawer" id="filterDrawer">
      <div class="filter-drawer-header">
        <h5 class="mb-0">Filter Options</h5>
        <button type="button" class="btn-close btn-close-white" id="filterDrawerClose"></button>
      </div>
      <div class="filter-drawer-body">
        <div class="accordion rounded-3 shadow-sm">
          <div class="accordion-item">
            <h4 class="accordion-header">
              <button
                class="accordion-button fs-6 fw-semibold"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#categories"
              >
                Categories
              </button>
            </h4>
            <div id="categories" class="accordion-collapse collapse show">
              <div class="accordion-body">
                <ul
                  class="list-unstyled d-grid gap-2"
                  id="categoryListBody"
                >
                  <li class="d-flex gap-2 align-items-center">
                    <input
                      type="checkbox"
                      id="cat1"
                      class="form-check-input"
                    />
                    <label for="cat1" class="form-check-label small"
                      >Minimal Wallpapers</label
                    >
                  </li>
                </ul>
              </div>
            </div>
          </div>

          <div class="accordion-item">
            <h4 class="accordion-header">
              <button
                class="accordion-button fs-6 fw-semibold collapsed"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#availability"
              >
                Availability
              </button>
            </h4>
            <div id="availability" class="accordion-collapse collapse">
              <div class="accordion-body">
                <ul class="list-unstyled d-grid gap-2" id="availabilityBody">
                  <li class="d-flex gap-2 align-items-center">
                    <input
                      type="radio"
                      checked
                      name="availability"
                      id="all-of-stock"
                      class="form-check-input"
                    />
                    <label for="all-of-stock" class="form-check-label small"
                      >All</label
                    >
                  </li>
                  <li class="d-flex gap-2 align-items-center">
                    <input
                      type="radio"
                      name="availability"
                      id="in-stock"
                      class="form-check-input"
                    />
                    <label for="in-stock" class="form-check-label small"
                      >In stock</label
                    >
                  </li>
                  <li class="d-flex gap-2 align-items-center">
                    <input
                      type="radio"
                      name="availability"
                      id="out-of-stock"
                      class="form-check-input"
                    />
                    <label for="out-of-stock" class="form-check-label small"
                      >Out of stock</label
                    >
                  </li>
                </ul>
              </div>
            </div>
          </div>

          <div class="accordion-item">
            <h4 class="accordion-header">
              <button
                class="accordion-button fs-6 fw-semibold collapsed"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#price"
              >
                Price Range
              </button>
            </h4>
            <div id="price" class="accordion-collapse collapse">
              <div class="accordion-body">
                <div class="d-flex gap-2 mb-3">
                  <div class="form-floating flex-fill">
                    <input
                      class="form-control"
                      type="number"
                      id="min-price"
                      placeholder="0"
                    />
                    <label for="min-price">Min</label>
                  </div>
                  <div class="form-floating flex-fill">
                    <input
                      class="form-control"
                      type="number"
                      id="max-price"
                      placeholder="0"
                    />
                    <label for="max-price">Max</label>
                  </div>
                </div>
                <div id="slider" class="mt-4 mx-2"></div>
              </div>
            </div>
          </div>

          <div class="accordion-item">
            <h4 class="accordion-header">
              <button
                class="accordion-button fs-6 fw-semibold collapsed"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#flavour"
              >
                Style Mood
              </button>
            </h4>
            <div id="flavour" class="accordion-collapse collapse">
              <div class="accordion-body text-muted small text-center">
                Filter by visual moods and palettes coming soon.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">

      <div class="container py-4 py-lg-5">

          <!-- Products -->
          <main>
            <div class="d-flex flex-column gap-4">
              <!-- Toolbar -->
              <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 p-3 rounded-3 shadow-sm">
                <p class="mb-0 text-muted small fw-medium" id="result-count">
                  Showing 13 results
                </p>

                <div class="d-flex gap-2 align-items-center flex-wrap">
                  <div class="d-flex">
                    <input
                      type="text"
                      class="form-control form-control-sm rounded-start-5"
                      id="search-input"
                      style="max-width: 200px;"
                    />
                    <button
                      class="btn btn-sm px-3 rounded-start-0 rounded-end-5"
                      id="search-button"
                      style="background-color: #4527a0; color: white"
                    >
                      Search
                    </button>
                  </div>

                  <button
                    class="btn btn-sm btn-filter-toggle text-nowrap"
                    id="filter-toggle-button"
                  >
                    <i class="bi bi-funnel"></i> Filter Options
                  </button>

                  <button
                    class="btn btn-sm btn-apply-filters text-nowrap"
                    id="apply-filters-button"
                  >
                    Apply Filters
                  </button>

                  <select class="form-select form-select-sm" id="st-sort" style="min-width: 160px;">
                    <option value="latest" selected>Sort from Latest</option>
                    <option value="oldest">Sort from Oldest</option>
                    <option value="alpha-desc">Sort by Name Descending</option>
                    <option value="alpha-asc">Sort by Name Ascending</option>
                    <option value="price-desc">Sort by Price : High to Low</option>
                    <option value="price-asc">Sort by Price : Low to High</option>
                  </select>
                </div>
              </div>

              <!-- Product Grid -->
              <div class="rounded-3 shadow-sm p-3 p-md-4">
                <div
                  class="row row-cols-1 row-cols-md-2 row-cols-lg-4 row-cols-xl-5 g-4 product-container"
                  id="product-container"
                ></div>
                <nav
                  aria-label="Store pagination"
                  class="d-flex justify-content-center mt-4 pt-2"
                >
                  <ul class="pagination shadow-sm" id="store-pagination">
                    <li class="page-item">
                      <a href="#" class="page-link" id="pagination-button-prev"><</a>
                    </li>
                    <li class="page-item active">
                      <a class="page-link" href="#" id="pagination-button">1</a>
                    </li>
                  </ul>
                </nav>
              </div>
              </div>
            </main>
        </div>


    </div><!-- /main-content -->

    <script src="assets/js/nouislider.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <script src="assets/js/header.js"></script>
    <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/shop.js"></script>
  </body>
</html>
