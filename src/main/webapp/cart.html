<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Aesthetica - Cart</title>
    <link href="assets/icons/favicon.ico" type="image/x-ico" rel="icon" />
    <link href="assets/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="assets/css/nav.css" rel="stylesheet" />
    <link href="assets/css/sidebar.css" rel="stylesheet" />
    <link href="assets/css/dark-theme.css" rel="stylesheet" />
    <link href="assets/css/cart-page.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <!-- Mobile Header -->
    <div class="mobile-header">
      <button class="sidebar-toggle" type="button" aria-label="Toggle navigation">
        <i class="bi bi-list fs-3"></i>
      </button>
      <a class="navbar-brand brand-logo" href="index.html"></a>
      <div
        class="kart-icon position-relative"
        onclick="window.location.href='cart.html'"
        style="cursor: pointer"
      >
        <i class="fa-solid fa-cart-shopping"></i>
        <span
          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
          id="shop-icon-badge-mobile"
        ></span>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <button class="sidebar-close" type="button" aria-label="Close">&times;</button>

      <div class="sidebar-brand">
        <a class="brand-logo" href="index.html"></a>
        <span class="sidebar-tagline">Curated visuals</span>
      </div>

      <nav class="sidebar-nav">
        <a class="sidebar-link" href="index.html"><i class="bi bi-house"></i>Home</a>
        <a class="sidebar-link" href="shop.html"><i class="bi bi-shop"></i>Shop</a>
        <a class="sidebar-link active" href="cart.html"><i class="fa-solid fa-cart-shopping"></i>Cart</a>
        <a class="sidebar-link" href="all_categories.html"><i class="bi bi-grid"></i>All Categories</a>
      </nav>

      <hr class="sidebar-divider" />

      <div class="sidebar-utilities">
        <div class="sidebar-cart" onclick="window.location.href='cart.html'" style="cursor: pointer">
          <div class="kart-icon position-relative">
            <i class="fa-solid fa-cart-shopping"></i>
            <span
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
              id="shop-icon-badge"
            ></span>
          </div>
          <span class="sidebar-cart-label">Cart</span>
          <span class="price" id="nav-cart-price">00.00</span>
        </div>

        <div id="auth-menu" class="sidebar-auth-stack d-none">
          <a class="sidebar-link" href="my_account.html"><i class="bi bi-person"></i>Profile</a>
          <a class="sidebar-link" onclick="signOut()"><i class="bi bi-box-arrow-right"></i>Log Out</a>
        </div>

        <div id="guest-auth-menu" class="sidebar-guest-auth d-none">
          <a href="sign_in.html" class="btn btn-outline-primary btn-sm">Sign In</a>
          <a href="sign_up.html" class="btn btn-primary btn-sm">Sign Up</a>
        </div>
      </div>

      <div class="sidebar-footer">
        <small>&copy; 2026 Aesthetica</small>
      </div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <div class="main-content">

    <div class="container py-4 py-lg-5">
      <div class="d-flex align-items-center gap-2 mb-4">
        <i class="fa-solid fa-cart-shopping fs-3" style="color: var(--accent);"></i>
        <h4 class="mb-0 fw-bold" style="color: var(--text-main);">Shopping Cart</h4>
      </div>

      <div class="row g-4 g-lg-5">

        <!-- Cart Items -->
        <div class="col-12 col-lg-8">
          <div id="cart-page-items">
            <div class="text-center py-5">
              <div class="spinner-border" style="color: var(--accent);" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Order Summary -->
        <div class="col-12 col-lg-4">
          <div class="sticky-lg-top" style="top: 100px;">
            <div class="order-summary-card p-4">
              <h5 class="card-title mb-3">Order Summary</h5>

              <div class="summary-row">
                <span>Subtotal</span>
                <span class="summary-value" id="summary-subtotal">$0.00</span>
              </div>

              <div class="summary-row">
                <span>Estimated Shipping</span>
                <span class="summary-value" id="summary-shipping">$0.00</span>
              </div>

              <div class="summary-row total">
                <span>Total</span>
                <span class="summary-value" id="summary-total">$0.00</span>
              </div>

              <a href="checkout.html" class="btn btn-lg w-100 mt-4" style="background-color: #5e35b1; color: white;">
                Proceed to Checkout
              </a>

              <a href="shop.html" class="btn btn-outline-secondary w-100 mt-2">
                Continue Shopping
              </a>
            </div>
          </div>
        </div>

      </div>
    </div>



    </div><!-- /main-content -->

    <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/cart-page.js"></script>
  </body>
</html>
