<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Aesthetica - Sign Up</title>
    <link href="assets/css/onboarding.css" rel="stylesheet" />
    <link href="assets/icons/favicon.ico" type="image/x-ico" rel="icon" />
    <link href="assets/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="assets/css/notification.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link href="assets/css/dark-theme.css" rel="stylesheet" />
  </head>
  <body class="sign-in-page">
    <div class="sign-in-wrapper">
      <div class="sign-in-card">
        <div class="brand-header">AESTHETICA</div>
        <h1 class="sign-up-title">Register</h1>

        <div class="form-floating mt-4">
          <input class="form-control" id="fn" type="text" placeholder="First Name" />
          <label for="fn">First Name</label>
        </div>

        <div class="form-floating mt-3">
          <input class="form-control" id="ln" type="text" placeholder="Last Name" />
          <label for="ln">Last Name</label>
        </div>

        <div class="form-floating mt-3">
          <input class="form-control" id="email" type="text" placeholder="Email" />
          <label for="email">Email</label>
        </div>

        <div class="form-floating mt-3">
          <input class="form-control" id="mobile" type="text" placeholder="Mobile Number" />
          <label for="mobile">Mobile Number</label>
        </div>

        <div class="form-floating position-relative mt-3">
          <input type="password" id="password" placeholder="Password" class="form-control" />
          <label for="password" class="form-label">Password</label>
          <i class="bi bi-eye-slash password-toggle-icon" onclick="togglePassword('password', this)"></i>
        </div>

        <div class="form-floating position-relative mt-3">
          <input type="password" id="password2" placeholder="Confirm Password" class="form-control" />
          <label for="password2" class="form-label">Confirm Password</label>
          <i class="bi bi-eye-slash password-toggle-icon" onclick="togglePassword('password2', this)"></i>
        </div>

        <button class="btn sign-in-btn w-100 mt-4" onclick="sign_up()" style="background-color:#00f59b!important;color:#0b0f19!important;font-weight:700!important">Sign Up</button>

        <div class="sign-in-links justify-content-center">
          <a href="sign_in.html">Already have an account ?</a>
        </div>
      </div>

      <div class="sign-in-footer">
        <a href="#">Privacy Policy</a>
        <a href="#">User Agreement</a>
        <a href="#">Copyright &copy; 2026 Aesthetica</a>
      </div>
    </div>

    <script src="assets/js/notification.js"></script>
    <script src="assets/js/sign_up.js"></script>
    <script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
  </body>
</html>
