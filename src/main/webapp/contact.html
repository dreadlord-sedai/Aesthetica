<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Aesthetica - Contact</title>
    <link href="assets/icons/favicon.ico" type="image/x-ico" rel="icon" />
    <link href="assets/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="assets/css/nav.css" rel="stylesheet" />
    <link href="assets/css/dark-theme.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <nav
          class="navbar navbar-expand-lg navbar-light bg-white py-3 sticky-top shadow"
        >
          <div class="container-fluid px-2 px-md-5">
            <a class="navbar-brand brand-logo" href="index.html"></a>

            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarContent"
              aria-controls="navbarContent"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
              <ul
                class="navbar-nav mx-auto mb-2 mb-lg-0 gap-3 align-items-center mt-3 mt-lg-0"
              >
                <li class="nav-item">
                  <a class="nlink" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                  <a class="nlink" href="shop.html">Shop</a>
                </li>
                <li class="nav-item">
                  <a class="nlink" href="contact.html">Contact</a>
                </li>
                <li class="nav-item">
                  <a class="nlink text-center" href="all_categories.html"
                    >All Categories</a
                  >
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </div>
    </div>

    <div class="container py-5">
      <div class="row g-4">
        <div class="col-lg-5">
          <div class="card h-100 shadow-sm p-4">
            <h3 class="mb-3">Contact Us</h3>
            <p class="text-muted">
              Reach the Aesthetica team for support, feedback, or partnership
              inquiries.
            </p>
            <div class="mt-3">
              <p class="mb-2">
                <i class="bi bi-envelope me-2"></i>support@aesthetica.store
              </p>
              <p class="mb-2">
                <i class="bi bi-telephone me-2"></i>+94 77 123 4567
              </p>
              <p class="mb-0">
                <i class="bi bi-geo-alt me-2"></i>Colombo, Sri Lanka
              </p>
            </div>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="card shadow-sm p-4">
            <h4 class="mb-3">Send a Message</h4>
            <form onsubmit="submitContact(event)">
              <div class="row g-3">
                <div class="col-md-6 form-floating">
                  <input
                    id="contactName"
                    class="form-control"
                    type="text"
                    placeholder="Your name"
                    required
                  />
                  <label for="contactName">Your name</label>
                </div>
                <div class="col-md-6 form-floating">
                  <input
                    id="contactEmail"
                    class="form-control"
                    type="email"
                    placeholder="Email"
                    required
                  />
                  <label for="contactEmail">Email</label>
                </div>
                <div class="col-12 form-floating">
                  <input
                    id="contactSubject"
                    class="form-control"
                    type="text"
                    placeholder="Subject"
                    required
                  />
                  <label for="contactSubject">Subject</label>
                </div>
                <div class="col-12 form-floating">
                  <textarea
                    id="contactMessage"
                    class="form-control"
                    placeholder="Message"
                    style="height: 140px"
                    required
                  ></textarea>
                  <label for="contactMessage">Message</label>
                </div>
                <div class="col-12">
                  <button
                    type="submit"
                    class="btn"
                    style="background-color: #5e35b1; color: white"
                  >
                    Send Message
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
    <script>
      function submitContact(event) {
        event.preventDefault();
        Notiflix.Notify.success("Thanks! Your message has been recorded.");
        event.target.reset();
      }
    </script>
  </body>
</html>
